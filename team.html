<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Team - Task Manager</title>
  </head>
  <body>
    <header>
      <div class="search">
        <img src="./assets/img/search.svg" class="ui-icon" alt="search_icon" />
        <input type="text" placeholder="Search tasks" />
      </div>

      <div class="profile">
        <div class="notification">
          <img
            src="./assets/img/notification.svg"
            class="ui-icon"
            alt="notify_icon"
          />
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button">
          <img id="theme-icon" src="./assets/img/moon.svg" alt="theme icon" />
        </button>
        <img src="./assets/img/avatar.svg" alt="avatar_icon" />
        <div class="info">
          <h1>Kira Biloborodova</h1>
          <p>Team leader</p>
        </div>
      </div>
    </header>

    <div class="sidebar">
      <img src="./assets/img/logo.png" alt="logo_icon" />

      <nav>
        <a href="index.html"
          ><img
            src="./assets/img/dashboard.svg"
            class="ui-icon"
            alt="icon"
          />Dashboard</a
        >
        <a href="tasks.html"
          ><img
            src="./assets/img/tasks.svg"
            class="ui-icon"
            alt="icon"
          />Tasks</a
        >
        <a href="team.html"
          ><img src="./assets/img/team.svg" class="ui-icon" alt="icon" />Team</a
        >
      </nav>

      <footer>
        <p>TaskManager<br />Bohdan and Kira</p>
      </footer>
    </div>

    <main>
      <div class="heading">
        <div>
          <h1>Team</h1>
          <p>Manage team members</p>
        </div>
        <div>
          <button popovertarget="newmember">Add member</button>
          <button popovertarget="editmembers">Edit members</button>
        </div>
      </div>

      <div id="newmember" popover>
        <form action="" method="get">
          <div class="form-label">
            <label for="member_name">Enter member name: </label>
            <input
              type="text"
              name="member_name"
              id="member_name"
              required
              min="5"
            />
          </div>
          <div class="form-label">
            <label for="member_role">Select member role: </label>
            <select name="roles" id="member_role" required>
              <option value="">Select a role</option>
              <option value="user">User</option>
              <option value="manager">Team leader</option>
            </select>
          </div>

          <div class="form-label">
            <button type="submit">Add member</button>
          </div>
        </form>
      </div>

      <div id="editmembers" popover>
        <div class="members-table">
          <table>
            <thead>
              <tr>
                <th scope="col">Member Name</th>
                <th scope="col">Role</th>
              </tr>
            </thead>
            <tbody id="members-table">
              <tr>
                <td colspan="5">No members availible</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="statistics-group">
        <div class="box">
          <p>Total Tasks</p>
          <p id="total-Tasks">0</p>
        </div>
        <div class="box">
          <p>Completed Tasks</p>
          <p id="completed-Tasks">0</p>
        </div>
        <div class="box">
          <p>Team members</p>
          <p id="team-members">0</p>
        </div>
      </div>

      <div class="members-table">
        <table>
          <thead>
            <tr>
              <th scope="col">Member Name</th>
              <th scope="col">Role</th>
            </tr>
          </thead>
          <tbody id="table-members">
            <tr>
              <td colspan="5">No members availible</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>

  <script src="./assets/js/theme.js"></script>
  <script type="module" src="./assets/js/members.js"></script>
  <script type="module" src="./assets/js/tasks.js"></script>
</html>
