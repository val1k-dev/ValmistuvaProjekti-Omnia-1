<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon" />
    <title>Tasks - Task Manager</title>
  </head>
  <body>
    <header>
      <div class="search">
        <img src="./assets/img/search.svg" class="ui-icon" alt="search_icon" />
        <input type="text" placeholder="Search tasks" />
      </div>

      <div class="profile">
        <div class="notification">
          <img
            src="./assets/img/notification.svg"
            class="ui-icon"
            alt="notify_icon"
          />
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button">
          <img id="theme-icon" src="./assets/img/moon.svg" alt="theme icon" />
        </button>
        <img src="./assets/img/avatar.svg" alt="avatar_icon" />
        <div class="info">
          <h1>Kira Biloborodova</h1>
          <p>Team leader</p>
        </div>
      </div>
    </header>

    <div class="sidebar">
      <img src="./assets/img/logo.png" alt="logo_icon" />

      <nav>
        <a href="index.html"
          ><img
            src="./assets/img/dashboard.svg"
            class="ui-icon"
            alt="icon"
          />Dashboard</a
        >
        <a href="tasks.html"
          ><img
            src="./assets/img/tasks.svg"
            class="ui-icon"
            alt="icon"
          />Tasks</a
        >
        <a href="team.html"
          ><img src="./assets/img/team.svg" class="ui-icon" alt="icon" />Team</a
        >
        <a href="help.html"
          ><img src="./assets/img/help.svg" class="ui-icon" alt="icon" />Help</a
        >
      </nav>

      <footer>
        <p>TaskManager<br />Bohdan and Kira</p>
      </footer>
    </div>

    <main>
      <div class="heading">
        <div>
          <h1>Tasks</h1>
          <p>Manage tasks</p>
        </div>
        <div>
          <button popovertarget="newtask">New Task</button>
        </div>
      </div>

      <form id="newtask" popover>
        <div class="form-label">
          <label for="task_name">Enter task name: </label>
          <input
            type="text"
            name="task_name"
            id="task_name"
            placeholder="Enter task name"
            required
            min="5"
          />
        </div>
        <div class="form-label">
          <label for="task_person">Select desired person for the task: </label>
          <select name="persons" id="task_person" required></select>
        </div>
        <div class="form-label">
          <label for="task_priority">Select task priority: </label>
          <select name="priorities" id="task_priority" required>
            <option value="">Select priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="form-label">
          <label for="task_deadline">Select task deadline: </label>
          <input
            type="date"
            name="task_deadline"
            id="task_deadline"
            required
            min="2026-11-10"
          />
        </div>

        <div class="form-label">
          <button type="submit">Add task</button>
          <button id="hidepopover_task">Cancel</button>
        </div>
      </form>

      <form id="edittask" popover>
        <div class="form-label">
          <label for="task_name">Enter task name: </label>
          <input
            type="text"
            name="task_name"
            id="task_name"
            placeholder="Enter task name"
            required
            min="5"
          />
        </div>
        <div class="form-label">
          <label for="task_person">Select desired person for the task: </label>
          <select name="persons" id="task_person_edit" required></select>
        </div>
        <div class="form-label">
          <label for="task_priority">Select task priority: </label>
          <select name="priorities" id="task_priority" required>
            <option value="">Select priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="form-label">
          <label for="task_deadline">Select task deadline: </label>
          <input type="date" name="task_deadline" id="task_deadline" required />
        </div>

        <div class="form-label">
          <label for="task_status">Select task status: </label>
          <select name="statuses" id="task_status" required>
            <option value="Added">Added</option>
            <option value="In progress">In progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div class="form-label">
          <button type="submit">Edit task</button>
          <button id="delete_task">Delete task</button>
        </div>
      </form>

      <div class="statistics-group">
        <div class="box">
          <p>Total Tasks</p>
          <p id="total-Tasks">0</p>
        </div>
        <div class="box">
          <p>Completed Tasks</p>
          <p id="completed-Tasks">0</p>
        </div>
      </div>

      <div class="tasks-table">
        <table>
          <thead>
            <tr>
              <th scope="col">Task Name</th>
              <th scope="col">Person</th>
              <th scope="col">Priority</th>
              <th scope="col">Deadline</th>
              <th scope="col">Status</th>
              <th scope="col">Edit</th>
            </tr>
          </thead>
          <tbody id="tasks-table">
            <tr>
              <td colspan="5">No tasks availible</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>

  <script src="./assets/js/theme.js"></script>
  <script type="module" src="./assets/js/tasks.js"></script>
</html>
